# 로컬 개발용: Postgres + Redis
# 인증·스토리지까지 로컬에서 재현하려면 Supabase CLI(`supabase start`)를 대신 사용한다.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: murder
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
